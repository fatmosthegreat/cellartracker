<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Only this site's own scripts run; data goes only to Apps Script (which redirects to googleusercontent).
     'unsafe-eval' is for demo mode, which runs Code.gs in the browser; 'unsafe-inline' styles are the
     timeline's positions; data: images are the favicon and the ✨ photo preview. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Cellar</title>
<meta name="description" content="A cellar list: what's in the cellar, what's on the way, and what's been opened.">
<meta name="theme-color" content="#ECEAE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Cellar">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237A1D32'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='20' fill='%23ECEAE4'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/cellar.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Cellar list · Prices paid per bottle</p>
    <h1 id="title">Cellar</h1>
    <div class="stats" id="stats"></div>
    <p class="demo-note" id="demo-note" hidden>Demo mode: changes reset when you reload. Set <code>apiUrl</code> in <code>js/config.js</code> to use your Google Sheet.</p>
  </header>

  <section class="timeline" id="timeline" aria-label="When to open"></section>

  <div class="toolbar">
    <div class="chips" role="group" aria-label="Show">
      <button class="chip" type="button" data-filter="All" aria-pressed="true">All</button>
      <button class="chip" type="button" data-filter="In cellar" aria-pressed="false">In the cellar</button>
      <button class="chip" type="button" data-filter="On order" aria-pressed="false">On order</button>
      <button class="chip" type="button" data-filter="Consumed" aria-pressed="false">Consumed</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search wines, or “notes …” for tasting notes" aria-label="Search the cellar">
  </div>

  <main id="list" aria-live="polite"></main>

  <footer>
    <span id="owner-state"></span>
    <span class="footer-links">
      <button class="linkbtn" id="print-link" type="button">Print the list</button>
      <button class="linkbtn" id="owner-link" type="button">Owner login</button>
    </span>
  </footer>
</div>

<button class="btn primary fab" id="add" type="button">+ Add bottle</button>
<div class="toast" id="toast" role="status"></div>
<datalist id="producers"></datalist>
<datalist id="grapes"></datalist>
<datalist id="regions"></datalist>
<datalist id="places"></datalist>

<!-- Add or edit a bottle. Fields marked data-for only show for that tab ((cellar or consumed)). -->
<dialog id="editor" aria-labelledby="ed-title">
  <form class="dlg" id="ed-form" novalidate>
    <h3 id="ed-title">Add a bottle</h3>
    <div class="field"><label for="f-producer">Producer</label>
      <input id="f-producer" name="producer" autocomplete="off" list="producers" placeholder="Domaine Duroche"></div>
    <div class="field"><label for="f-wine">Wine</label>
      <input id="f-wine" name="wine" autocomplete="off" placeholder="Gevrey-Chambertin 1er Cru"></div>
    <div class="grid3">
      <div class="field"><label for="f-vintage">Vintage <span class="opt">· blank = NV</span></label>
        <input id="f-vintage" name="vintage" inputmode="numeric" maxlength="4" placeholder="2020"></div>
      <div class="field"><label for="f-price">Price / bottle</label>
        <input id="f-price" name="price" inputmode="decimal" placeholder="150"></div>
      <div class="field" data-for="cellar"><label for="f-bottles" id="ed-bottles-label">How many</label>
        <input id="f-bottles" name="bottles" type="number" min="1" step="1" inputmode="numeric"></div>
    </div>
    <div class="grid3" data-for="cellar">
      <div class="field"><label for="f-status">Status</label>
        <select id="f-status" name="status"><option>In cellar</option><option>On order</option></select></div>
      <!-- Shown only when Status is On order (js/app.js). -->
      <div class="field order-only"><label for="f-arrival">Collect or delivery</label>
        <select id="f-arrival" name="arrival"><option value="">Not set</option><option>Collect</option><option>Delivery</option></select></div>
      <div class="field order-only"><label for="f-collect">Due by</label><input id="f-collect" name="collectBy" type="date"></div>
      <div class="field order-only"><label for="f-collectTime">Time</label><input id="f-collectTime" name="collectTime" type="time"></div>
    </div>
    <div class="grid2" data-for="consumed">
      <div class="field"><label for="f-consumedOn">Consumed on</label><input id="f-consumedOn" name="consumedOn" type="date"></div>
      <div class="field"><label for="f-rating">Rating /10</label>
        <input id="f-rating" name="rating" type="number" min="0" max="10" step="0.5" inputmode="decimal"></div>
    </div>
    <details id="ed-more">
      <summary>More details</summary>
      <div class="more">
        <div class="grid2">
          <div class="field"><label for="f-colour">Colour</label>
            <!-- Options come from the Lists tab in the sheet (js/app.js fills them in). -->
            <select id="f-colour" name="colour"><option value="">Not set</option></select></div>
          <div class="field"><label for="f-grape">Grape</label>
            <input id="f-grape" name="grape" autocomplete="off" list="grapes" placeholder="Pinot Noir"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="f-region">Region</label>
            <input id="f-region" name="region" autocomplete="off" list="regions" placeholder="Burgundy"></div>
        </div>
        <div class="grid2" data-for="cellar">
          <div class="field"><label for="f-window">Drinking window</label>
            <input id="f-window" name="drinkWindow" data-field="window" autocomplete="off" placeholder="2028–2035"></div>
          <div class="field"><label for="f-storage">Where it is</label>
            <input id="f-storage" name="storage" autocomplete="off" list="places" placeholder="Friend's fridge"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="f-purchased">Bought on</label><input id="f-purchased" name="purchased" type="date"></div>
        </div>
        <div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes"></textarea></div>
        <label class="check" for="f-hidden"><input id="f-hidden" name="hidden" type="checkbox">
          <span>Hide from friends<small>Only you see it when logged in.</small></span></label>
      </div>
    </details>
    <!-- No name attributes here, so readFields() never sends these with the bottle. -->
    <div class="ai-panel" id="ai-panel" hidden>
      <div class="ai-row">
        <input id="ai-text" type="text" maxlength="200" autocomplete="off" aria-label="Describe the wine" placeholder="e.g. rousseau gevrey 2019, or a note for the photo">
        <label class="ai-cam" for="ai-photo" title="Take or choose a photo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2.5h6L17 7h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>
          <span class="sr-only">Take or choose a photo</span>
        </label>
        <input id="ai-photo" class="sr-only" type="file" accept="image/*">
        <button type="button" class="btn primary" id="ai-go">Fill in</button>
      </div>
      <div class="ai-thumb" id="ai-thumb" hidden>
        <img alt="The photo you chose">
        <button type="button" class="btn" id="ai-unphoto">Remove photo</button>
      </div>
      <p class="ai-status" id="ai-status" role="status"></p>
    </div>
    <p class="form-error" role="alert"></p>
    <div class="dlg-foot">
      <!-- ✨ Fill in with AI: only when adding, logged in, and not in demo mode (js/app.js). -->
      <button type="button" class="ai-toggle" id="ai-toggle" aria-expanded="false" aria-controls="ai-panel" title="Fill in with AI" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/><path d="M19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>
        <span class="sr-only">Fill in with AI</span>
      </button>
      <button type="button" class="btn danger" id="ed-delete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="ed-save">Save</button>
    </div>
  </form>
</dialog>

<!-- Opened one: moves a bottle from the Cellar tab to the Consumed tab -->
<dialog id="drinker" aria-labelledby="dr-title">
  <form class="dlg" id="dr-form" novalidate>
    <h3 id="dr-title">How was it?</h3>
    <p class="sub" id="dr-sub"></p>
    <div class="grid2">
      <div class="field"><label for="d-date">Consumed on</label><input id="d-date" name="consumedOn" type="date"></div>
      <div class="field"><label for="d-rating">Rating /10 <span class="opt">· optional</span></label>
        <input id="d-rating" name="rating" type="number" min="0" max="10" step="0.5" inputmode="decimal"></div>
    </div>
    <div class="field" id="dr-count-row"><label for="d-count">Bottles opened</label>
      <input id="d-count" name="count" type="number" min="1" step="1" inputmode="numeric"></div>
    <div class="field"><label for="d-notes">Tasting notes <span class="opt">· optional</span></label>
      <textarea id="d-notes" name="notes" placeholder="Tight at first, opened up after an hour…"></textarea></div>
    <p class="form-error" role="alert"></p>
    <div class="dlg-foot"><span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="dr-save">Move to Consumed</button></div>
  </form>
</dialog>

<!-- Tasting card: opens when a consumed bottle is tapped. Anyone can see it; Edit is for the owner. -->
<dialog id="tasting" aria-labelledby="ts-title">
  <div class="dlg">
    <div id="ts-body"></div>
    <div class="dlg-foot"><span class="spacer"></span>
      <button type="button" class="btn" id="ts-edit">Edit</button>
      <button type="button" class="btn primary" data-close>Close</button></div>
  </div>
</dialog>

<dialog id="login" aria-labelledby="lg-title">
  <form class="dlg" id="lg-form" novalidate>
    <h3 id="lg-title">Owner login</h3>
    <div class="field"><label for="lg-key">Passkey</label>
      <input id="lg-key" name="key" type="password" autocomplete="current-password"></div>
    <p class="sub" id="lg-hint" hidden>Demo passkey: <code>cellar</code></p>
    <p class="form-error" role="alert"></p>
    <div class="dlg-foot"><span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="lg-save">Log in</button></div>
  </form>
</dialog>
</body>
</html>
