<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellar</title>
<meta name="description" content="A cellar list: what's in the cellar, what's on the way, and what's been drunk.">
<meta name="theme-color" content="#ECEAE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Cellar">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237A1D32'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='20' fill='%23ECEAE4'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/cellar.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Cellar list · Prices paid per bottle</p>
    <h1 id="title">Cellar</h1>
    <div class="stats" id="stats"></div>
    <p class="demo-note" id="demo-note" hidden>Demo mode: changes reset when you reload. Set <code>apiUrl</code> in <code>js/config.js</code> to use your Google Sheet.</p>
  </header>

  <section class="timeline" id="timeline" aria-label="When to open"></section>

  <div class="toolbar">
    <div class="chips" role="group" aria-label="Show">
      <button class="chip" type="button" data-filter="All" aria-pressed="true">All</button>
      <button class="chip" type="button" data-filter="In cellar" aria-pressed="false">In the cellar</button>
      <button class="chip" type="button" data-filter="To collect" aria-pressed="false">To collect</button>
      <button class="chip" type="button" data-filter="Drunk" aria-pressed="false">Drunk</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search producer, wine, grape" aria-label="Search the cellar">
  </div>

  <main id="list" aria-live="polite"></main>

  <footer>
    <span id="owner-state"></span>
    <button class="linkbtn" id="owner-link" type="button">Owner login</button>
  </footer>
</div>

<button class="btn primary fab" id="add" type="button">+ Add bottle</button>
<div class="toast" id="toast" role="status"></div>
<datalist id="producers"></datalist>

<!-- Add or edit a bottle. Fields marked data-for only show for that tab (cellar or drunk). -->
<dialog id="editor" aria-labelledby="ed-title">
  <form class="dlg" id="ed-form" novalidate>
    <h3 id="ed-title">Add a bottle</h3>
    <div class="field"><label for="f-producer">Producer</label>
      <input id="f-producer" name="producer" autocomplete="off" list="producers" placeholder="Domaine Duroche"></div>
    <div class="field"><label for="f-wine">Wine</label>
      <input id="f-wine" name="wine" autocomplete="off" placeholder="Gevrey-Chambertin 1er Cru"></div>
    <div class="grid3">
      <div class="field"><label for="f-vintage">Vintage <span class="opt">· blank = NV</span></label>
        <input id="f-vintage" name="vintage" inputmode="numeric" maxlength="4" placeholder="2020"></div>
      <div class="field"><label for="f-price">Price / bottle</label>
        <input id="f-price" name="price" inputmode="decimal" placeholder="150"></div>
      <div class="field" data-for="cellar"><label for="f-bottles" id="ed-bottles-label">How many</label>
        <input id="f-bottles" name="bottles" type="number" min="1" step="1" inputmode="numeric"></div>
    </div>
    <div class="grid2" data-for="drunk">
      <div class="field"><label for="f-drunkOn">Drunk on</label><input id="f-drunkOn" name="drunkOn" type="date"></div>
      <div class="field"><label for="f-rating">Rating /10</label>
        <input id="f-rating" name="rating" type="number" min="0" max="10" step="0.5" inputmode="decimal"></div>
    </div>
    <details id="ed-more">
      <summary>More details</summary>
      <div class="more">
        <div class="grid2">
          <div class="field"><label for="f-colour">Colour</label>
            <select id="f-colour" name="colour">
              <option value="">Not set</option><option>Red</option><option>White</option><option>Rosé</option>
              <option>Sparkling</option><option>Sweet</option><option>Fortified</option>
            </select></div>
          <div class="field"><label for="f-grape">Grape</label>
            <input id="f-grape" name="grape" autocomplete="off" placeholder="Pinot Noir"></div>
        </div>
        <div class="grid2" data-for="cellar">
          <div class="field"><label for="f-window">Drinking window</label>
            <input id="f-window" name="drinkWindow" data-field="window" autocomplete="off" placeholder="2028–2035"></div>
          <div class="field"><label for="f-status">Status</label>
            <select id="f-status" name="status"><option>In cellar</option><option>To collect</option></select></div>
        </div>
        <div class="grid2">
          <div class="field" data-for="cellar"><label for="f-storage">Where it is</label>
            <input id="f-storage" name="storage" autocomplete="off" placeholder="Friend's fridge"></div>
          <div class="field"><label for="f-purchased">Bought on</label><input id="f-purchased" name="purchased" type="date"></div>
        </div>
        <div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes"></textarea></div>
        <label class="check" for="f-hidden"><input id="f-hidden" name="hidden" type="checkbox">
          <span>Hide from friends<small>Only you see it when logged in.</small></span></label>
      </div>
    </details>
    <p class="form-error" role="alert"></p>
    <div class="dlg-foot">
      <button type="button" class="btn danger" id="ed-delete">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="ed-save">Save</button>
    </div>
  </form>
</dialog>

<!-- Drank one: moves a bottle from the Cellar tab to the Drunk tab -->
<dialog id="drinker" aria-labelledby="dr-title">
  <form class="dlg" id="dr-form" novalidate>
    <h3 id="dr-title">How was it?</h3>
    <p class="sub" id="dr-sub"></p>
    <div class="grid2">
      <div class="field"><label for="d-date">Drunk on</label><input id="d-date" name="drunkOn" type="date"></div>
      <div class="field"><label for="d-rating">Rating /10 <span class="opt">· optional</span></label>
        <input id="d-rating" name="rating" type="number" min="0" max="10" step="0.5" inputmode="decimal"></div>
    </div>
    <div class="field" id="dr-count-row"><label for="d-count">Bottles drunk</label>
      <input id="d-count" name="count" type="number" min="1" step="1" inputmode="numeric"></div>
    <div class="field"><label for="d-notes">Tasting notes <span class="opt">· optional</span></label>
      <textarea id="d-notes" name="notes" placeholder="Tight at first, opened up after an hour…"></textarea></div>
    <p class="form-error" role="alert"></p>
    <div class="dlg-foot"><span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="dr-save">Move to Drunk</button></div>
  </form>
</dialog>

<dialog id="login" aria-labelledby="lg-title">
  <form class="dlg" id="lg-form" novalidate>
    <h3 id="lg-title">Owner login</h3>
    <div class="field"><label for="lg-key">Passkey</label>
      <input id="lg-key" name="key" type="password" autocomplete="current-password"></div>
    <p class="sub" id="lg-hint" hidden>Demo passkey: <code>cellar</code></p>
    <p class="form-error" role="alert"></p>
    <div class="dlg-foot"><span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="lg-save">Log in</button></div>
  </form>
</dialog>
</body>
</html>
